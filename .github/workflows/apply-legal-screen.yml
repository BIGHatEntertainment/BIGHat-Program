name: apply-legal-screen
on:
  push:
    branches: [fix-legal-screen-view]
    paths: ['.github/workflows/apply-legal-screen.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify, place
        run: |
          set -e
          B='https://customer-assets-jt897jd0.emergentagent.net/wingman/da26ecda-379e-4789-81bd-529e0c2dad93/attachments'
          curl -fsSL -o /tmp/pages.zip "$B/35b1fa85481d47d4b1354efe520e1a8e_legal_pages.zip"
          curl -fsSL -o /tmp/screen.jsx "$B/7872b007bd0345008c443f14aee160b4_LegalAcceptScreen_new.jsx"
          echo 'd1b08f28b2fa93c584821220b3d25f168e1a58ea3a0f16a68a3ef02d141db862  /tmp/pages.zip' | sha256sum -c -
          echo '35d6be0ce2ee833239a2aed87559adbd96bbaef0f7b8d79a4556452f7cff898b  /tmp/screen.jsx' | sha256sum -c -
          mkdir -p frontend/public/legal/pages
          unzip -o -q /tmp/pages.zip -d frontend/public/legal/pages
          test $(ls frontend/public/legal/pages/*.png | wc -l) -eq 12
          cp /tmp/screen.jsx frontend/src/pages/LegalAcceptScreen.jsx
          git status --short | head -20
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add frontend/public/legal/pages frontend/src/pages/LegalAcceptScreen.jsx
          git commit -m 'Legal accept screen: show page images in a scrolling panel (the desktop PDF viewer rendered a small strip and blocked the new-window link)' || exit 0
          git pull --rebase origin fix-legal-screen-view
          git push
