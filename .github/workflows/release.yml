name: Release Tauri builds

# Triggers on:
#   - Any tag starting with v32, e.g. v32.0.0
#   - Manual dispatch from the Actions UI (handy for dry-running the workflow
#     against a branch without cutting a real release)
on:
  push:
    tags:
      - 'v32.*'
      - 'v33.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the release (e.g. 32.0.0)'
        required: true
        type: string
      draft:
        description: 'Create the release as a draft'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write   # required to create/update GitHub Releases

jobs:
  # Creates the ONE draft release that both build legs upload into. Before
  # this job existed, each leg created its own draft at the same moment and
  # GitHub kept two separate drafts (v32.1.1: .exe on one, .dmg on the other),
  # so the verify gate never saw both installers together.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - name: Create draft release (once)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          TAG="v$V"
          # Reuse an existing draft for this tag if a previous run left one.
          # (Drafts are listed as 'untagged-...', so match on the release name.)
          ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            --jq "[.[] | select(.name==\"BIG Hat Entertainment $TAG\" and .draft==true)][0].id // empty")
          if [ -z "$ID" ]; then
            ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="BIG Hat Entertainment $TAG" \
              -f body="Native Tauri desktop builds. See CHANGELOG.md for the full notes." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using release id $ID for $TAG"

  build-tauri:
    name: ${{ matrix.label }}
    needs: create-release
    timeout-minutes: 75    # any leg stuck > 75 min (incl. queued-waiting-for-runner) auto-fails so a stuck macOS runner can't tie up a release indefinitely
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - label: macOS (Apple Silicon)
            os: macos-15          # was macos-14: GitHub retires that image on 2026-11-02 and fails it in brownouts (Oct 30 2026 killed v32.2.6's Mac build). macos-15 is also arm64.
            target: aarch64-apple-darwin
            bundles: dmg,app

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Sync VERSION.txt and tauri.conf.json
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          echo "$V" > backend/VERSION.txt
          # Patch the Tauri config so the bundle metadata matches the tag.
          python -c "
          import json, pathlib
          p = pathlib.Path('src-tauri/tauri.conf.json')
          c = json.loads(p.read_text())
          c['version'] = '$V'
          p.write_text(json.dumps(c, indent=2))
          "
          cat backend/VERSION.txt
          python -c "import json; print('tauri version:', json.load(open('src-tauri/tauri.conf.json'))['version'])"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.target }}

      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend (relative URLs)
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ''
          # GitHub Actions sets CI=true, which makes CRA treat ALL warnings
          # (including react-hooks/exhaustive-deps, which we've intentionally
          # downgraded to warnings) as errors. Unset it for the build step
          # only. Real undefined-reference bugs are still pinned as hard
          # errors by frontend/craco.config.js — see CHANGELOG v31.0.15.
          CI: ''
        run: yarn build

      - name: Freeze Python sidecar via PyInstaller
        env:
          # `emergentintegrations` (Emergent's LLM SDK used by the Story
          # Generator) is hosted on a private CDN — not on public PyPI.
          # The dev container has this URL pinned in pip.conf; GitHub
          # runners don't, so set it explicitly here.
          PIP_EXTRA_INDEX_URL: https://d33sy5i8bnduwe.cloudfront.net/simple/
        run: python scripts/build_sidecar.py --target ${{ matrix.target }}

      # v32.1.9 release gate. v32.1.8 shipped a backend whose Scoreboard router crashed while loading INSIDE the bundle (it created a
      # folder beside its own file, read-only there). The app still started, so nothing noticed. This runs the frozen backend that is
      # about to be packaged and FAILS THE BUILD if any router failed to load or the Scoreboard does not answer.
      - name: Smoke-test the frozen backend (fails the release if a router did not load)
        shell: bash
        run: |
          set -e
          BIN=$(ls src-tauri/binaries/bighat-backend-* | head -1)
          echo "testing $BIN"
          case "${{ matrix.target }}" in
            *apple-darwin)
              ARCH=$(uname -m)
              case "${{ matrix.target }}" in
                aarch64-*) WANT=arm64;; x86_64-*) WANT=x86_64;; *) WANT=$ARCH;;
              esac
              if [ "$ARCH" != "$WANT" ]; then echo "::warning::cross-built sidecar ($WANT on $ARCH runner) cannot run here; the gate was SKIPPED for this target"; exit 0; fi ;;
          esac
          python scripts/smoke_frozen_backend.py "$BIN"

      - name: Build Tauri app
        id: build1
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer ID cert yet — `-` triggers ad-hoc signing,
          # which lets the .app + .dmg bundle without erroring. Users will
          # still see the Gatekeeper warning on first launch (right-click
          # → Open). Real signing + notarization is a future task; needs
          # APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # secrets to land in repo Actions settings first.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          # Upload into the single draft made by create-release. Never create
          # a release here (that is what produced two drafts for v32.1.1).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build Tauri app (retry once)
        id: build2
        if: steps.build1.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple Developer ID cert yet — `-` triggers ad-hoc signing,
          # which lets the .app + .dmg bundle without erroring. Users will
          # still see the Gatekeeper warning on first launch (right-click
          # → Open). Real signing + notarization is a future task; needs
          # APPLE_CERTIFICATE / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
          # secrets to land in repo Actions settings first.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          # Upload into the single draft made by create-release. Never create
          # a release here (that is what produced two drafts for v32.1.1).
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  # -------------------------------------------------------------------------
  # Gate job: runs AFTER the matrix and refuses to let an incomplete release
  # be visible to customers. If any of (Windows .exe, macOS Apple Silicon
  # .dmg) is missing from the release at this tag, the job
  # fails LOUDLY — customers never see the half-baked release because
  # tauri-action's draft toggle is honored on miss (or the release is
  # explicitly demoted back to draft by this job on partial uploads).
  # -------------------------------------------------------------------------
  verify-release-assets:
    name: Verify release assets are complete
    needs: [create-release, build-tauri]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V"     >> "$GITHUB_OUTPUT"

      - name: Verify all 2 OS installers uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          REL_ID: ${{ needs.create-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking up release id $REL_ID (tag $TAG)..."
          if [ -z "$REL_ID" ]; then
            echo "::error::create-release did not produce a release id."
            exit 1
          fi
          REL_JSON=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}")
          ASSETS=$(echo "$REL_JSON" | python -c "import sys,json;print('\n'.join(a['name'] for a in json.load(sys.stdin).get('assets',[])))")
          echo "Assets currently on release:"
          echo "$ASSETS" | sed 's/^/  /'

          MISSING=()
          # We don't care about the exact byte-for-byte file name, just that
          # one .exe for windows + one .dmg per mac arch is present.
          echo "$ASSETS" | grep -Eqi 'BIG.*Hat.*Entertainment.*Setup.*\.exe$|BIG.*Hat.*Entertainment.*\.exe$' || MISSING+=("windows-setup.exe")
          echo "$ASSETS" | grep -Eqi 'aarch64.*\.dmg$|arm64.*\.dmg$'                                              || MISSING+=("macos-apple-silicon.dmg")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::Release $TAG is INCOMPLETE — missing: ${MISSING[*]}. Demoting back to draft so customers cannot see a half-baked release."
            curl -sS -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" \
              -d '{"draft":true}' >/dev/null
            echo "Release demoted to draft. Inspect the failed matrix legs above, fix the root cause, re-run failed jobs (or cut a new tag), and only re-publish once all 3 binaries are present."
            exit 1
          fi
          echo "All 2 OS binaries present. Release $TAG is publishable."

          # Force the release to be PUBLIC (not draft, not prerelease). This
          # is the only place a release transitions from build-in-progress to
          # customer-visible — every other path is fail-closed.
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${REL_ID}" \
            -d '{"draft":false,"prerelease":false,"make_latest":"true"}' >/dev/null
          echo "Release $TAG published publicly."
