name: swap-3rd-video
on:
  push:
    branches: [update-3rd-place-video]
    paths: ['.github/workflows/swap-3rd-video.yml']
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and replace video
        run: |
          curl -fsSL -o /tmp/new.mp4 'https://customer-assets-jt897jd0.emergentagent.net/wingman/da26ecda-379e-4789-81bd-529e0c2dad93/attachments/f25c83e1e6c44350a0460c5251369cee_Place_3rd.mp4'
          test $(stat -c%s /tmp/new.mp4) -eq 5838304
          cp /tmp/new.mp4 backend/assets/slides/winners/place_3rd.mp4
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add backend/assets/slides/winners/place_3rd.mp4
          git commit -m 'Replace trivia 3rd place winners video' || exit 0
          git push
