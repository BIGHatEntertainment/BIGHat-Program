name: patch-app
on:
  push:
    branches: [add-legal-docs-installer]
    paths: ['.github/workflows/patch-app.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.js
        run: |
          python3 - <<'PY'
          p='frontend/src/App.js'
          s=open(p,encoding='utf-8').read()
          a="import { Toaster } from './components/ui/sonner';\n"
          assert s.count(a)==1
          s=s.replace(a,a+"import LegalAcceptScreen, { hasAcceptedLegal, GUEST_PATHS } from './pages/LegalAcceptScreen';\n")
          b="  const location = useLocation();\n\n  // v31.0.10 hardening"
          assert s.count(b)==1
          s=s.replace(b,"  const location = useLocation();\n  const [legalOk, setLegalOk] = React.useState(hasAcceptedLegal());\n\n  // v31.0.10 hardening")
          c="  if (loading) return <LoadingScreen label=\"Initializing...\" />;\n"
          assert s.count(c)==1
          s=s.replace(c,c+"\n  // Legal acceptance on first launch (all desktop builds, incl. Mac which has no\n  // installer license page). Guest phone / TV pages are never blocked.\n  if (nativeMode && !legalOk && !GUEST_PATHS.includes(location.pathname)) {\n    return <LegalAcceptScreen onAccept={() => setLegalOk(true)} />;\n  }\n")
          open(p,'w',encoding='utf-8').write(s)
          PY
          git diff --stat
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add frontend/src/App.js
          git commit -m 'Show legal accept screen on first launch (native mode, guest pages exempt)' || exit 0
          git push
