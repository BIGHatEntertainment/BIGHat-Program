name: add-assets
on:
  push:
    branches: [add-legal-docs-installer]
    paths: ['.github/workflows/add-assets.yml']
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -e
          CA='https://customer-assets-jt897jd0.emergentagent.net/wingman/da26ecda-379e-4789-81bd-529e0c2dad93/attachments/2bb7dc59bf7c48b8a5ab4eaaa8a91bff_California_Privacy_Addendum_fixed.pdf'
          curl -fsSL -o /tmp/ca.pdf "$CA"
          test $(stat -c%s /tmp/ca.pdf) -gt 50000
          cp /tmp/ca.pdf src-tauri/legal/California_Privacy_Addendum.pdf
          mkdir -p frontend/public/legal
          cp src-tauri/legal/Terms_and_Conditions.pdf src-tauri/legal/Privacy_Policy.pdf src-tauri/legal/California_Privacy_Addendum.pdf frontend/public/legal/
          pip install -q pypdf
          python3 - <<'PY'
          import re,pypdf
          def rtf(s):
              o=[]
              for ch in s:
                  c=ord(ch)
                  if ch=='\\': o.append('\\\\')
                  elif ch in '{}': o.append('\\'+ch)
                  elif ch=='\n': o.append('\\par\n')
                  elif c>127: o.append('\\u%d?'%(c if c<32768 else c-65536))
                  else: o.append(ch)
              return ''.join(o)
          parts=[('TERMS AND CONDITIONS','Terms_and_Conditions'),('PRIVACY POLICY','Privacy_Policy'),('CALIFORNIA PRIVACY ADDENDUM','California_Privacy_Addendum')]
          b='{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Segoe UI;}}\\f0\\fs20\n'
          b+=rtf('Please read the following documents. By clicking I Agree you accept the Terms and Conditions and acknowledge the Privacy Policy and California Privacy Addendum. Copies (PDF) are also installed in the legal folder inside the program folder.\n\n')
          for i,(t,n) in enumerate(parts):
              txt='\n'.join(p.extract_text() or '' for p in pypdf.PdfReader('src-tauri/legal/'+n+'.pdf').pages)
              txt=re.sub(r'[ \t]+\n','\n',txt)
              if i: b+='\\page\n'
              b+='{\\b\\fs28 '+rtf(t)+'}\\par\\par\n'+rtf(txt)+'\\par\n'
          b+='}'
          open('src-tauri/legal/LICENSE.rtf','w',encoding='ascii').write(b)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add -A src-tauri/legal frontend/public/legal
          git commit -m 'Legal: remove [confirm] from California addendum; serve PDFs from the app for the first-launch screen' || exit 0
          git pull --rebase origin add-legal-docs-installer
          git push
