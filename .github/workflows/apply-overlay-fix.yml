name: apply-overlay-fix
on:
  push:
    branches: [fix-overlay-persistence]
    paths: ['.github/workflows/apply-overlay-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and apply patch
        run: |
          set -e
          curl -fsSL -o /tmp/fix.patch 'https://customer-assets-jt897jd0.emergentagent.net/wingman/da26ecda-379e-4789-81bd-529e0c2dad93/attachments/9c3aa22171cf4abcb0b2ea881368b385_overlay_fix.patch'
          echo '3f92714e5cb50cb297579b08eaa045661ad0ce7e1ae66f81fada1e81964307e0  /tmp/fix.patch' | sha256sum -c -
          git apply --check -p1 /tmp/fix.patch
          git apply -p1 /tmp/fix.patch
          git diff --stat
          python3 -m py_compile backend/native/locations_router.py backend/native/venue_sync.py backend/native_slides.py backend/presentation_builder.py
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add backend frontend
          git commit -m '32.1.0: overlay round tags survive launches; REG and MISC overlays are chosen by round number' || exit 0
          git pull --rebase origin fix-overlay-persistence
          git push
