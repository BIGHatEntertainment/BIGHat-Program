name: fix-license-key
on:
  push:
    branches: [fix-license-file-key]
    paths: ['.github/workflows/fix-license-key.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move licenseFile
        run: |
          python3 - <<'PY'
          import json
          p='src-tauri/tauri.conf.json'
          c=json.load(open(p,encoding='utf-8'))
          n=c['bundle']['windows']['nsis']
          assert n.pop('licenseFile')=='legal/LICENSE.rtf'
          c['bundle']['licenseFile']='legal/LICENSE.rtf'
          open(p,'w',encoding='utf-8').write(json.dumps(c,indent=2,ensure_ascii=False)+'\n')
          PY
          git diff --stat
          git diff
      - name: Commit
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add src-tauri/tauri.conf.json
          git commit -m 'Fix: licenseFile belongs at bundle level (Tauri rejected it under nsis, which broke alpha.111)' || exit 0
          git pull --rebase origin fix-license-file-key
          git push
