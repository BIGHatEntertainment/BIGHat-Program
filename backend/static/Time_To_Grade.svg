<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="60%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <!-- Big animated pause bars -->
  <g transform="translate(960 400)" filter="url(#glow)">
    <rect x="-100" y="-140" width="60" height="280" rx="10" fill="#F4C430">
      <animate attributeName="opacity" values="1;0.55;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="-140" width="60" height="280" rx="10" fill="#F4C430">
      <animate attributeName="opacity" values="0.55;1;0.55" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="960" y="720" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
        font-size="140" font-weight="900" fill="#F4C430" filter="url(#pulse)"
        letter-spacing="12">TIME TO GRADE</text>
  <text x="960" y="820" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="56" font-weight="600" fill="#cfd8ff" letter-spacing="8">
    Collect answer sheets — press → for answers
  </text>
</svg>
