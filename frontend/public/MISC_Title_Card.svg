<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="40%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#050a1a"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#g)"/>
  <text x="960" y="560" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif"
        font-size="380" font-weight="900" fill="#F4C430" filter="url(#glow)"
        letter-spacing="20">MISC</text>
  <text x="960" y="720" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="64" font-weight="700" fill="#ffffff" letter-spacing="14">ANYTHING GOES</text>
</svg>
